[project]
name = "saife"
version = "0.1.0"
description = "sAIfe: a multi-pass hallucination guard for agentic AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.142.2",
    "httpx2>=2.13.1",
    "openai>=3.24.0",
    "pydantic>=2",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "sse-starlette>=3.5.0",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
saife = "saife.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saife"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "live: calls real model APIs and spends credits (deselect with -m 'not live')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "ASYNC240"]  # fake keys; sync tmp_path checks are fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]
plugins = ["pydantic.mypy"]
# Windows Application Control blocks the compiled ast_serialize DLL; the Python parser works everywhere.
native_parser = false

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
